[package]
name = "elecwhat"
version = "1.16.2"
description = "Simple desktop whatsapp client for linux"
authors = ["Pierre Carru <pierre@carru.fr>"]
homepage = "https://github.com/piec/elecwhat"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[lib]
name = "elecwhat_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.34", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
notify-rust = "4"
regex = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
zbus = "6"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
